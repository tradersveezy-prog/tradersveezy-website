<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d">
  <title id="t">Break under and reclaim</title>
  <desc id="d">Price breaks under a key level, then closes back above â€” a failed break that needs confirmation.</desc>
  <rect width="1200" height="680" fill="#060606"/>
  <defs>
    <pattern id="g" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M0 48H48" stroke="#F2F1EE" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="680" fill="url(#g)"/>
  <rect x="48" y="72" width="1104" height="536" fill="#0B0B0B" stroke="#F2F1EE" stroke-opacity="0.12"/>

  <line x1="120" y1="320" x2="1080" y2="320" stroke="#E3B44A" stroke-width="2.5"/>
  <rect x="990" y="300" width="110" height="28" fill="#E3B44A"/>
  <text x="1045" y="319" fill="#060606" font-family="ui-monospace, monospace" font-size="13" font-weight="700" letter-spacing="0.1em" text-anchor="middle">KEY LEVEL</text>

  <g stroke-width="2.5">
    <!-- hold above -->
    <g stroke="#4FB286" fill="#4FB286">
      <line x1="180" y1="180" x2="180" y2="300"/><rect x="168" y="200" width="24" height="70"/>
      <line x1="260" y1="160" x2="260" y2="290"/><rect x="248" y="170" width="24" height="80"/>
      <line x1="340" y1="200" x2="340" y2="310"/><rect x="328" y="220" width="24" height="60"/>
    </g>
    <!-- break under -->
    <g stroke="#D9533B" fill="#D9533B">
      <line x1="420" y1="240" x2="420" y2="420"/><rect x="408" y="260" width="24" height="110"/>
      <line x1="500" y1="300" x2="500" y2="470"/><rect x="488" y="330" width="24" height="100"/>
    </g>
    <!-- reclaim -->
    <g stroke="#4FB286" fill="#4FB286">
      <line x1="580" y1="280" x2="580" y2="450"/><rect x="568" y="290" width="24" height="120"/>
      <line x1="660" y1="200" x2="660" y2="340"/><rect x="648" y="210" width="24" height="90"/>
      <line x1="740" y1="180" x2="740" y2="310"/><rect x="728" y="190" width="24" height="80"/>
      <line x1="820" y1="160" x2="820" y2="290"/><rect x="808" y="170" width="24" height="85"/>
    </g>
  </g>

  <!-- Scoop arrow under level -->
  <path d="M480 455 Q 540 520, 600 400" fill="none" stroke="#D9533B" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="540" y="530" fill="#D9533B" font-family="ui-monospace, monospace" font-size="13" letter-spacing="0.14em" text-anchor="middle">DIP UNDER</text>

  <circle cx="660" cy="300" r="12" fill="none" stroke="#4FB286" stroke-width="2"/>
  <path d="M672 290 L780 220" stroke="#4FB286" stroke-width="1.5"/>
  <rect x="760" y="180" width="200" height="52" fill="#161513" stroke="#4FB286"/>
  <text x="860" y="202" fill="#4FB286" font-family="ui-monospace, monospace" font-size="12" letter-spacing="0.14em" text-anchor="middle">CLOSE BACK</text>
  <text x="860" y="220" fill="#F2F1EE" font-family="ui-monospace, monospace" font-size="12" letter-spacing="0.06em" text-anchor="middle">then wait · confirm</text>

  <text x="48" y="48" fill="#E3B44A" font-family="ui-monospace, monospace" font-size="14" letter-spacing="0.22em">FLIP · FAILED BREAK</text>
  <text x="48" y="640" fill="#A9A59D" font-family="ui-monospace, monospace" font-size="13" letter-spacing="0.08em">Break · close back · several confirms â€” do not size on the first reclaim candle</text>
</svg>
